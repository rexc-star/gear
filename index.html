<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>裝備計數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9EDF3; --panel:#F8FAFC; --panel2:#EEF2F7; --ink:#18202E; --muted:#5C6878; --line:#CDD5E0;
  --gold:#A5761B; --blue:#2463D6; --red:#C8323F; --legend:#C27A00; --crest:#6D48C2; --set:#15876A; --white:#6E7B8C; --other:#56606E;
  --warn-bg:#FDECEC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --panel:#1A2130; --panel2:#212A3B; --ink:#E6EAF2; --muted:#98A3B5; --line:#2E3A4F;
    --gold:#E0B55A; --blue:#6FA2FF; --red:#FF6B76; --legend:#FFB23E; --crest:#AE8BFF; --set:#43C9A2; --white:#B9C3D0; --other:#A7B0BD;
    --warn-bg:#3A1F25;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --panel:#1A2130; --panel2:#212A3B; --ink:#E6EAF2; --muted:#98A3B5; --line:#2E3A4F;
  --gold:#E0B55A; --blue:#6FA2FF; --red:#FF6B76; --legend:#FFB23E; --crest:#AE8BFF; --set:#43C9A2; --white:#B9C3D0; --other:#A7B0BD;
  --warn-bg:#3A1F25;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans SC","Noto Sans KR","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header{padding:18px 20px 14px;border-bottom:2px solid var(--gold);background:var(--panel);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.06em}
header h1 small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px}
.builds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:18px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}}
html[lang="en"] .wrap,html[lang="ko"] .wrap{max-width:1420px;grid-template-columns:minmax(0,1fr) 580px}
@media (max-width:1040px){html[lang="en"] .wrap,html[lang="ko"] .wrap{grid-template-columns:minmax(0,1fr)}}
html[lang="en"] .slots,html[lang="ko"] .slots{grid-template-columns:repeat(auto-fill,minmax(372px,1fr))}
html[lang="en"] .sum table,html[lang="ko"] .sum table{font-size:12.5px}
html[lang="en"] .sum th,html[lang="en"] .sum td,html[lang="ko"] .sum th,html[lang="ko"] .sum td{padding:5px 4px}
html[lang="en"] .sum .sub,html[lang="ko"] .sum .sub{font-size:10.5px}
@media (max-width:460px){html[lang="en"] .slots,html[lang="ko"] .slots{grid-template-columns:minmax(0,1fr)}}
section.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
section.box > h2{margin:0 0 10px;font-size:17px;font-weight:700;display:flex;gap:10px;align-items:center}
section.box > h2 .swatch{width:6px;height:18px;border-radius:2px}
.hint{color:var(--muted);font-size:13px}
select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{width:92px;text-align:right}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid currentColor;border-radius:999px;padding:1px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--set);color:#fff}
.setvals{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.setvals label{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel2);padding:6px 10px;border-radius:6px}

/* slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:420px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px}
.slot-head{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.slot-head input{flex:1;font-weight:700;background:transparent;border-color:transparent}
.slot-head input:hover{border-color:var(--line)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:0}
.tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;color:#fff;white-space:nowrap}
.t-blue{background:var(--blue)} .t-red{background:var(--red)} .t-legend{background:var(--legend)} .t-other{background:var(--other)}
.line select.g{width:66px}
.slot-head select{width:auto}
.line input[type=number]{width:84px}
.cap{grid-column:2 / -1;font-size:12px;color:var(--muted);margin-top:-2px}
.cap.over{color:var(--red);font-weight:700}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--red)}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adds button,.adds select{font-size:13px;padding:3px 9px}
.adds .ab-blue{color:var(--blue)} .adds .ab-red{color:var(--red)} .adds .ab-legend{color:var(--legend)}
.empty{font-size:13px;color:var(--muted);padding:4px 0}

/* summary */
aside{position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:920px){aside{position:static}}
.sum{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:14px 14px 10px}
.sum h2{margin:0 0 4px;font-size:18px;font-weight:900;letter-spacing:.04em}
.legend-keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend-keys i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:0}
.tablewrap{overflow-x:auto;max-height:70vh;overflow-y:auto}
@media (max-width:920px){.tablewrap{max-height:none}}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:5px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--panel);font-weight:500;color:var(--muted);font-size:12px}
td.total{font-weight:900;font-size:15px}
td.c{color:var(--crest)} td.s{color:var(--set)} td.b{color:var(--blue)} td.r{color:var(--red)} td.l{color:var(--legend)}
td.z{color:var(--line)}
td.w{color:var(--white)}
.t-white{background:none;color:var(--ink);padding-left:0;padding-right:2px}
.off{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 0}
.off-toggle{display:flex;justify-content:flex-end;margin:-6px 0 4px}
.white{display:flex;gap:6px;align-items:center;font-size:13px;margin:-2px 0 8px}
.white input{width:70px}
.white select{width:auto}
.linkbtn{border:0;background:none;color:var(--gold);padding:0 4px;font-size:12px;text-decoration:underline}
.bar{height:3px;border-radius:2px;background:var(--gold);opacity:.55;margin-top:2px}
.sub{font-size:11px;color:var(--muted);font-weight:400}
td.st{text-align:left;font-size:13px;font-weight:700}
.st.over,.tally .over{color:var(--red)} .st.short,.tally .short{color:var(--legend)} .st.full,.tally .full{color:var(--set)}
.tally{display:flex;gap:12px;font-size:13px;font-weight:700;margin-bottom:6px}
.warns{margin-top:10px;background:var(--warn-bg);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--red)}
.warns ul{margin:4px 0 0;padding-left:18px}
.sumhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.sumhead h2{margin:0}
.btnlink{background:var(--gold);color:#fff;border-radius:6px;padding:5px 12px;text-decoration:none}
#imgDlg{width:min(900px,94vw)}
#gearDlg textarea{height:210px;font-family:inherit;font-size:13.5px;line-height:1.7}
.foot{font-size:12px;color:var(--muted);margin-top:10px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog textarea{width:100%;height:240px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:12px}

/* 部位顏色 */
:root{--sc-weapon:#C2410C;--sc-helm:#0E8A8A;--sc-armor:#2563EB;--sc-boots:#8B5A2B;--sc-shield:#4F46E5;--sc-ring:#B7860B;--sc-cloak:#9333EA;--sc-other:#6B7280}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sc-weapon:#FB8A4C;--sc-helm:#3CCFCF;--sc-armor:#6FA2FF;--sc-boots:#D39A62;--sc-shield:#9A94FF;--sc-ring:#F2C14E;--sc-cloak:#C98BFF;--sc-other:#A7B0BD}}
:root[data-theme="dark"]{--sc-weapon:#FB8A4C;--sc-helm:#3CCFCF;--sc-armor:#6FA2FF;--sc-boots:#D39A62;--sc-shield:#9A94FF;--sc-ring:#F2C14E;--sc-cloak:#C98BFF;--sc-other:#A7B0BD}
.sc-weapon{--sc:var(--sc-weapon)} .sc-helm{--sc:var(--sc-helm)} .sc-armor{--sc:var(--sc-armor)} .sc-boots{--sc:var(--sc-boots)}
.sc-shield{--sc:var(--sc-shield)} .sc-ring{--sc:var(--sc-ring)} .sc-cloak{--sc:var(--sc-cloak)} .sc-other{--sc:var(--sc-other)}
.slot{border-left:6px solid var(--sc,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--sc,transparent) 12%,var(--panel2)) 0,var(--panel2) 64px)}
.slot-head input[data-f="name"]{color:var(--sc,var(--ink))}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1><span id="hTitle"></span><small id="hSub"></small></h1>
  <div class="builds">
    <select id="langSel"></select>
    <select id="buildSel"></select>
    <button id="bNew"></button>
    <button id="bDup"></button>
    <button id="bRen"></button>
    <button id="bDel"></button>
    <button id="bIO"></button>
  </div>
</header>

<div class="wrap">
  <main>
    <section class="box">
      <h2><span class="swatch" style="background:var(--crest)"></span><span id="hCrest"></span></h2>
      <div class="row" style="margin-bottom:8px">
        <label class="row" style="gap:6px"><span id="lCls"></span> <select id="clsSel"></select></label>
        <span class="hint" id="hClsHint"></span>
      </div>
      <div class="row">
        <select id="crestSel"></select>
        <span class="hint" id="hCrestNote"></span>
      </div>
      <div class="chips" id="crestChips"></div>
    </section>

    <section class="box">
      <h2><span class="swatch" style="background:var(--set)"></span><span id="hSet"></span></h2>
      <div class="row">
        <select id="setSel"></select>
        <div class="seg" id="tierSeg" role="group">
          <button data-t="0"></button><button data-t="1"></button><button data-t="2"></button><button data-t="3"></button>
        </div>
      </div>
      <div class="setvals" id="setVals"></div>
      <p class="hint" id="setHint" style="margin:8px 0 0"></p>
    </section>

    <section class="box">
      <h2><span class="swatch" style="background:var(--gold)"></span><span id="hEquip"></span></h2>
      <div class="slots" id="slots"></div>
      <div class="adds" style="margin-top:12px"><button id="addSlot"></button><button id="restoreSlots"></button><button id="clearAll"></button></div>
    </section>
  </main>

  <aside>
    <div class="sum">
      <div class="sumhead"><h2 id="sumTitle"></h2><div class="row" style="gap:6px"><button id="bImg"></button><button id="bGear"></button></div></div>
      <div class="legend-keys" id="legendKeys"></div>
      <div class="tablewrap" id="sumTable"></div>
      <div id="warns"></div>
      <p class="foot" id="foot"></p>
    </div>
  </aside>
</div>

<dialog id="gearDlg">
  <h3 style="margin-top:0" id="gearH"></h3>
  <p class="hint" id="gearHint"></p>
  <textarea id="gearText" spellcheck="false" readonly></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <span class="hint" id="gearMsg" style="margin-right:auto"></span>
    <button id="gearCopy"></button>
    <button id="gearImg" class="primary"></button>
    <button id="gearClose"></button>
  </div>
</dialog>
<dialog id="imgDlg">
  <h3 style="margin-top:0" id="imgH"></h3>
  <p class="hint" id="imgHint"></p>
  <div style="overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:6px"><img id="imgPrev" style="display:block;max-width:100%"></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <a id="imgDl" class="btnlink"></a>
    <button id="imgClose"></button>
  </div>
</dialog>
<dialog id="io">
  <h3 style="margin-top:0" id="ioH"></h3>
  <p class="hint" id="ioHint"></p>
  <textarea id="ioText" spellcheck="false"></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <span class="hint" id="ioMsg" style="margin-right:auto"></span>
    <button id="ioCopy"></button>
    <button id="ioImport" class="primary"></button>
    <button id="ioClose"></button>
  </div>
</dialog>

<script>
/* ---------- 多語 / Languages ---------- */
const LANGS = [["zh-Hant","繁體中文"],["zh-Hans","简体中文"],["en","English"],["ko","한국어"]];
const LI = {"zh-Hant":0,"zh-Hans":1,"en":2,"ko":3};
const LOCALE = {"zh-Hant":"zh-TW","zh-Hans":"zh-CN","en":"en-US","ko":"ko-KR"};
const LKEY = "eqcalc.lang";
let LANG = (()=>{
  try{ const v=localStorage.getItem(LKEY); if(v&&LI[v]!=null) return v; }catch(e){}
  const n=(navigator.language||"").toLowerCase();
  if(n.startsWith("ko")) return "ko";
  if(n.startsWith("zh")) return /hans|-cn|-sg|-my/.test(n)?"zh-Hans":"zh-Hant";
  if(n.startsWith("en")) return "en";
  return "zh-Hant";
})();
const LX = ()=>LI[LANG];
const pick = a => Array.isArray(a) ? (a[LX()]!=null?a[LX()]:a[0]) : a;

/* 屬性名稱：[簡體, English, 한국어]；繁中用原 key */
const ST = {
"物攻":["物攻","Attack","포스"],"命中":["命中","Accuracy","어큐레이트"],
"施法縮時":["施法缩时","Cast Speed","와이즈"],"集氣維持":["集气维持","Cast Duration","베어"],
"遠攻":["远攻","Ranged","디스턴트"],"詛咒":["诅咒","Curse Time","커즈"],
"補助":["补助","Aid Time","에이드"],"保護":["保护","Protect Time","마스킹"],
"無視":["无视","Magic Ignore","베이직 레지스트"],"AC":["AC","AC","AC"],
"物理回避":["物理回避","Dodge","스마트"],
"冰抗":["冰抗","Ice Resist","레지스트 프리즈"],"毒抗":["毒抗","Poison Resist","레지스트 베넘"],
"電抗":["电抗","Lightning Resist","레지스트 라이트닝"],"火抗":["火抗","Fire Resist","레지스트 블레이즈"],
"麻痹抗":["麻痹抗","Paralysis Resist","레지스트 패러리시스"],"聖抗":["圣抗","Holy Resist","레지스트 홀리"],
"全抗":["全抗","All Resist","레지스트 올"],"移動力":["移动力","Speed","스피드"],
"HP":["HP","HP","라이프"],"MP":["MP","MP","마나"],"聖力值":["圣力值","Divine","디바인"],
"體力":["体力","Health","헬쓰"],"回血":["回血","HP Regen","페이틀"],
"回藍":["回蓝","MP Regen","매직"],"回綠":["回绿","Divine Regen","네이쳐"],
"力量":["力量","Strength","스트렝스"],"敏捷":["敏捷","Dexterity","덱스터리티"],
"體質":["体质","Constitution","컨스티튜션"],"智慧":["智慧","Wisdom","위즈덤"],
"智力":["智力","Intelligence","인텔리전스"],"魅力":["魅力","Charisma","카리스마"],
"耐力":["耐力","Endurance","인듀어런스"],"移動（能力值）":["移动（能力值）","Movement (stat)","무브먼트"],
"幸運":["幸运","Lucky","럭키"],"魔法能量":["魔法能量","Wizard (WS)","위자드"],
"神聖能量":["神圣能量","Priest (PS)","프리스트"],"法術穿透":["法术穿透","Spell Penetration","주문 관통"],
"魔增":["魔增","Magic Vigor","매직 비거"],"聖增":["圣增","Nature Vigor","네이쳐 비거"],
"魔持":["魔持","Magic Stay","매직 스테이"],"聖持":["圣持","Nature Stay","네이쳐 스테이"],
"暴擊":["暴击","Critical","크리티컬"],"魔法回避":["魔法回避","Evasion","이베이젼"],
"大奪藍":["大夺蓝","Mana Drain","위츠"],"小奪藍":["小夺蓝","Mana Steal","데블"],
"大奪綠":["大夺绿","Divine Drain","이블"],"小奪綠":["小夺绿","Divine Steal","세이튼"],
"大奪血":["大夺血","Life Drain","디자이어"],"小奪血":["小夺血","Life Steal","라버"],
"大奪體":["大夺体","Health Drain","위어리"],"小奪體":["小夺体","Health Steal","패티그"],
"小反射":["小反射","Counter","카운터어택"],"大反射":["大反射","Strike","스트라이크"],
"麻痹":["麻痹","Paralyze","마비"],"混亂":["混乱","Confuse","혼란"],"中毒":["中毒","Poison","중독"],
"石化":["石化","Petrify","석화"],"緩慢":["缓慢","Slow","슬로우"],"看魂":["看魂","See Ghost","영혼 보기"],
"魔抗":["魔抗","Magic Resist","마법 저항"]
};
const S = n => (LANG==="zh-Hant"||!ST[n]) ? n : (ST[n][LX()-1]||n);

/* 組別名稱：繁中、簡體、英文沿用原英文組名，只補韓文 */
const GN = {
"Force Group":"포스 그룹","Distance Group":"디스턴트 그룹","Hardest Group":"하디스트 그룹",
"Snag Group":"스내그 그룹","Life Group":"라이프 그룹","Mana Group":"마나 그룹","Divine Group":"디바인 그룹",
"Magic Vigor Group":"매직 비거 그룹","Nature Vigor Group":"네이쳐 비거 그룹","Rising Group":"라이징 그룹",

function whiteAC(s){ if(!whiteShown(s)) return 0; return (s.wac!=null) ? s.wac : whiteAuto(s); }
const KINDN = {w:["武器","武器","Weapon","무기"],a:["防具","防具","Armor","방어구"],r:["戒指","戒指","Ring","반지"],c:["披風","披风","Cloak","망토"]};
const KINDS = {w:99,a:99,r:3,c:3};
const kindName = k => KINDN[k][LX()];
const DEFAULT_SLOTS = [["weapon","w"],["helm","a"],["armor","a"],["boots","a"],["shield","a"],["ring1","r"],["ring2","r"],["cloak","c"]];
const slotKind = s => s.kind || "a";
const slotCap = s => KINDS[slotKind(s)];
const hasLegend = s => ["w","a"].includes(slotKind(s));
const gradeMax = (e,s) => Math.min(e.maxG, slotCap(s));
const slotName = s => s.name || posName(s.pos) || t("newSlot");

/* ---------- 工具 ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unit = s=>PCT.has(s)?"%":SEC.has(s)?t("sec"):"";
function fmt(n){ if(!isFinite(n)) return "0"; const r=Math.round(n*100)/100; return r.toLocaleString(LOCALE[LANG],{maximumFractionDigits:2}); }
function statOpts(list,sel){ return list.map(s=>`<option value="${esc(s)}" ${s===sel?"selected":""}>${esc(S(s))}</option>`).join(""); }
function blueOpts(sel){
  return GROUPS.map(([gid,gname,list])=>`<optgroup label="${esc(GNM(gname))}">${list.map(([en])=>{const id=gid+"."+en.replace(/\s+/g,"_");const e=E[id];return `<option value="${id}" ${id===sel?"selected":""}>${esc(S(e.stat))}　${esc(en)}</option>`;}).join("")}</optgroup>`).join("");
}

const KEY="eqcalc.v2";
function newBuild(name){ return {name, cls:"", crest:"", setJob:"", setTier:0, setVals:[null,null], slots:DEFAULT_SLOTS.map(([p,k])=>({pos:p,kind:k,lines:[]}))}; }
let store;
try{ store = JSON.parse(localStorage.getItem(KEY)); }catch(e){ store=null; }
if(!store || !Array.isArray(store.builds) || !store.builds.length) store={builds:[newBuild(t("buildN",1))],cur:0};
if(store.cur>=store.builds.length) store.cur=0;
store.builds.forEach(b=>{ (b.slots||[]).forEach(sl=>{
  if(!sl.pos){ const p=nameToPos(sl.name); if(p) sl.pos=p; }
  if(sl.pos && sl.name && POSN[sl.pos] && POSN[sl.pos].includes(sl.name)) delete sl.name;
  sl.lines=(sl.lines||[]).filter(l=>l.type!=="blue"||E[l.id]);
}); });
store.builds.forEach(b=>b.slots.forEach(sl=>sl.lines.forEach(l=>{ if(l.type==="blue"){ if(E[l.id]) l.value=eVal(E[l.id],Math.min(l.g||1,E[l.id].maxG)); } else { if(RENAME[l.stat]) l.stat=RENAME[l.stat]; if(l.type==="red"&&RV[l.stat]&&!l.h){ const vs=RV[l.stat][0]; let h=vs.findIndex(v=>v>=l.value); l.h=h<0?15:h+1; l.value=vs[l.h-1]; } if(l.type==="legend"&&!l.g){ l.g=LEG_G; const v=legVal(l.stat,LEG_G); if(v!=null&&!l.value) l.value=v; } } })));
const B = ()=>store.builds[store.cur];
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }

/* ---------- 裝備 ---------- */
const TYPE = {blue:["tagBlue","t-blue"],red:["tagRed","t-red"],legend:["tagLegend","t-legend"],other:["tagOther","t-other"]};
function legendPool(si){
  const b=B(), pool=LEGEND[b.cls];
  if(!pool) return ALL.map(s=>[s,S(s)]);
  const seen=new Set(), out=[];
  for(const n of pool[slotKind(b.slots[si])==="w"?"w":"a"]){ const st=LNAME[n]; if(seen.has(st)) continue; seen.add(st);
    out.push([st, LANG==="zh-Hant" ? (n===st?n:`${n}（${st}）`) : S(st)]); }
  return out;
}
function legendOpts(si,sel){
  const p=legendPool(si); if(sel && !p.some(x=>x[0]===sel)) p.push([sel,t("notInPool",S(sel))]);
  return p.map(([v,txt])=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(txt)}</option>`).join("");
}
function blueCapInfo(l,slot){
  const e=E[l.id], gm=gradeMax(e,slot), m=eVal(e,gm);
  const over = Math.abs(l.value)>Math.abs(m)+1e-9;
  const txt = t("blueCap",GNM(e.gname),fmt(e.g10)+unit(e.stat),fmt(e.max)+unit(e.stat))
    +(slotCap(slot)<e.maxG? t("slotMaxG",gm,fmt(m)) : "")+(over?t("overCap"):"");
  return {over,txt};
}
function lineHTML(l,si,li){
  const slot=B().slots[si], d=`data-s="${si}" data-l="${li}"`;
  let statCtl, gradeCtl="<span></span>", cap="";
  const stat = l.type==="blue"? E[l.id].stat : l.stat;
  if(l.type==="blue"){
    const e=E[l.id], gm=gradeMax(e,slot);
    statCtl=`<select ${d} data-f="id" aria-label="${esc(t("aStat"))}">${blueOpts(l.id)}</select>`;
    gradeCtl=`<select class="g" ${d} data-f="g" aria-label="${esc(t("aGrade"))}">${Array.from({length:gm},(_,i)=>`<option value="${i+1}" ${l.g===i+1?"selected":""}>G${i+1}</option>`).join("")}</select>`;
    const c=blueCapInfo(l,slot); cap=`<div class="cap ${c.over?"over":""}">${esc(c.txt)}</div>`;
  } else if(l.type==="red"){
    statCtl=`<select ${d} data-f="stat" aria-label="${esc(t("aStat"))}">${statOpts(Object.keys(RED),l.stat)}</select>`;
    gradeCtl=`<select class="g" ${d} data-f="h" aria-label="${esc(t("aGrade"))}">${Array.from({length:15},(_,i)=>`<option value="${i+1}" ${l.h===i+1?"selected":""}>H${i+1}</option>`).join("")}</select>`;
    const m=RED[l.stat], over=l.value>m;
    cap=`<div class="cap ${over?"over":""}">${esc(t("redCap",fmt(m)+unit(l.stat))+(over?t("overCap"):""))}</div>`;
  } else if(l.type==="legend"){
    statCtl=`<select ${d} data-f="stat" aria-label="${esc(t("aStat"))}">${legendOpts(si,l.stat)}</select>`;
    gradeCtl=`<select class="g" ${d} data-f="g" aria-label="${esc(t("aGrade"))}">${Array.from({length:LEG_MAXG},(_,i)=>`<option value="${i+1}" ${l.g===i+1?"selected":""}>G${i+1}</option>`).join("")}</select>`;
    cap=`<div class="cap">${esc(t("legCap",B().cls?clsName(B().cls):t("anyCls"),slotKind(slot)==="w"?t("poolW"):t("poolA"))+(BY_STAT[l.stat]?"":t("legNoTable")))}</div>`;
  } else {
    statCtl=`<input type="text" ${d} data-f="stat" value="${esc(l.stat)}" placeholder="${esc(t("statPH"))}" aria-label="${esc(t("statPH"))}">`;
  }
  return `<div class="line"><span class="tag ${TYPE[l.type][1]}">${esc(t(TYPE[l.type][0]))}</span>${statCtl}${gradeCtl}<span class="num"><input type="number" step="any" ${d} data-f="value" value="${l.value}" aria-label="${esc(t("aValue"))}">${unit(stat)}</span><button class="x" ${d} data-act="del" aria-label="${esc(t("aDelLine"))}">×</button>${cap}</div>`;
}
function slotColor(s){
  const p=s.pos||nameToPos(s.name);
  const m={weapon:"sc-weapon",helm:"sc-helm",armor:"sc-armor",boots:"sc-boots",shield:"sc-shield",ring1:"sc-ring",ring2:"sc-ring",cloak:"sc-cloak"}[p];
  if(m) return m;
  return {w:"sc-weapon",r:"sc-ring",c:"sc-cloak"}[slotKind(s)]||"sc-other";
}
function renderSlots(){
  const b=B();
  $("#slots").innerHTML = b.slots.map((s,si)=>`
    <div class="slot ${slotColor(s)}">
      <div class="slot-head">
        <input type="text" value="${esc(slotName(s))}" data-s="${si}" data-f="name" aria-label="${esc(t("aSlotName"))}">
        <select data-s="${si}" data-f="kind" data-prev="${slotKind(s)}" aria-label="${esc(t("aSlotKind"))}">${Object.keys(KINDS).map(k=>`<option value="${k}" ${slotKind(s)===k?"selected":""}>${esc(kindName(k))}${KINDS[k]<99?"（≤G"+KINDS[k]+"）":""}</option>`).join("")}</select>
        <button class="x" data-s="${si}" data-act="delslot" aria-label="${esc(t("aDelSlot"))}" title="${esc(t("aDelSlot"))}">×</button>
      </div>
      ${!slotOn(s)?`<div class="off"><span>${esc(t("noShield")+(NO_SHIELD.includes(B().cls)&&s.on==null?t("noShieldCls",clsName(B().cls)):""))}</span><button data-s="${si}" data-act="shieldon">${esc(t("shieldOn"))}</button></div>`:`
      ${isShield(s)?`<div class="off-toggle"><button class="linkbtn" data-s="${si}" data-act="shieldoff">${esc(t("shieldOff"))}</button></div>`:""}
      ${isCloak(s)?`<div class="white"><span class="tag t-white">${esc(t("cloakTag"))}</span><select data-s="${si}" data-f="cloak" aria-label="${esc(t("cloakA"))}"><option value="" ${!CLOAK[s.cloak]?"selected":""}>${esc(t("cloakNone"))}</option>${Object.keys(CLOAK).map(k=>`<option value="${k}" ${s.cloak===k?"selected":""}>${esc(cloakName(k))}</option>`).join("")}</select></div>`:""}
      ${whiteShown(s)&&whiteAtk(s)?`<div class="white"><span class="tag t-white">${esc(t("wAtk"))}</span> ${esc(S("物攻"))} <input type="number" step="any" class="num" data-s="${si}" data-f="watk" value="${whiteAtk(s)}" aria-label="${esc(t("wAtk"))}"><span class="hint">${esc(t("wRange",CLOAK.atk.range))}</span></div>`:""}
      ${whiteShown(s)&&whiteHP(s)?`<div class="white"><span class="tag t-white">${esc(t("wHp"))}</span> ${esc(S("HP"))} +${fmt(whiteHP(s))}</div>`:""}
      ${whiteShown(s)?`<div class="white"><span class="tag t-white">${esc(t("wAc"))}</span> AC <input type="number" step="any" class="num" data-s="${si}" data-f="wac" value="${whiteAC(s)}" aria-label="${esc(t("wAc"))}">${s.wac!=null?`<button class="linkbtn" data-s="${si}" data-act="wacauto">${esc(t("wReset"))}</button>`:`<span class="hint">${esc(isCloak(s)?t("wDefault",cloakName(s.cloak)):whitePos(s)==="weapon"?t("wWarrior"):(B().cls?t("wDefault",clsName(B().cls)):t("wPickCls")))}</span>`}</div>`:""}
      ${s.lines.length? s.lines.map((l,li)=>lineHTML(l,si,li)).join("") : `<div class="empty">${esc(t("noLines"))}</div>`}
      <div class="adds">
        <button class="ab-blue" data-s="${si}" data-add="blue">${esc(t("addBlue"))}</button>
        <button class="ab-red" data-s="${si}" data-add="red">${esc(t("addRed"))}</button>
        ${hasLegend(s)?`<button class="ab-legend" data-s="${si}" data-add="legend">${esc(t("addLegend"))}</button>`:""}
        <button data-s="${si}" data-add="other">${esc(t("addOther"))}</button>
      </div>`}
    </div>`).join("");
}
function newBlue(id,slot){ const e=E[id], g=gradeMax(e,slot); return {type:"blue",id,g,value:eVal(e,g)}; }
const slotsEl=$("#slots");
slotsEl.addEventListener("click",e=>{
  const el=e.target.closest("button"); if(!el) return;
  const b=B(), si=+el.dataset.s, slot=b.slots[si];
  if(el.dataset.add){
    const ty=el.dataset.add;
    if(ty==="blue") slot.lines.push(newBlue("force.force",slot));
    else if(ty==="red") slot.lines.push(newRed("物攻"));
    else if(ty==="legend") slot.lines.push(newLegend(legendPool(si)[0][0]));
    else slot.lines.push({type:"other",stat:"",value:0});
  } else if(el.dataset.act==="wacauto"){ delete slot.wac; }
  else if(el.dataset.act==="shieldon"){ slot.on=true; }
  else if(el.dataset.act==="shieldoff"){ slot.on=false; }
  else if(el.dataset.act==="del"){ slot.lines.splice(+el.dataset.l,1); }
  else if(el.dataset.act==="delslot"){ if(slot.lines.length && !confirm(t("delSlotAsk",slotName(slot)))) return; b.slots.splice(si,1); }
  else return;
  save(); renderSlots(); renderSummary();
});
slotsEl.addEventListener("change",e=>{
  const el=e.target; if(el.tagName!=="SELECT") return;
  const slot=B().slots[+el.dataset.s], f=el.dataset.f;
  if(f==="cloak"){ slot.cloak=el.value; delete slot.wac; delete slot.watk; save(); renderSlots(); renderSummary(); return; }
  if(f==="kind"){
    slot.kind=el.value;
    if(!hasLegend(slot)){ const n=slot.lines.filter(l=>l.type==="legend").length; if(n&&!confirm(t("noLegendKind",kindName(slot.kind),n))){ slot.kind=el.dataset.prev||"a"; renderSlots(); return; } slot.lines=slot.lines.filter(l=>l.type!=="legend"); }
    slot.lines.forEach(l=>{ if(l.type==="blue"){ const gm=gradeMax(E[l.id],slot); if(l.g>gm){ l.g=gm; l.value=eVal(E[l.id],gm);} } });
  } else {
    const l=slot.lines[+el.dataset.l];
    if(l.type==="blue"){
      if(f==="id"){ l.id=el.value; l.g=Math.min(l.g,gradeMax(E[l.id],slot)); }
      if(f==="g") l.g=+el.value;
      l.value=eVal(E[l.id],l.g);
    } else if(l.type==="legend"){
      if(f==="stat") l.stat=el.value;
      if(f==="g") l.g=+el.value;
      const v=legVal(l.stat,l.g); if(v!=null) l.value=v;
    } else if(l.type==="red"){
      if(f==="stat"){ l.stat=el.value; l.h=Math.min(l.h||rCapH(l.stat),rCapH(l.stat)); }
      if(f==="h") l.h=+el.value;
      l.value=rVal(l.stat,l.h);
    } else if(f==="stat"){ l.stat=el.value; }
  }
  save(); renderSlots(); renderSummary();
});
slotsEl.addEventListener("input",e=>{
  const el=e.target; if(el.tagName!=="INPUT") return;
  const slot=B().slots[+el.dataset.s];
  if(el.dataset.f==="name"){
    const v=el.value;
    if(slot.pos && (v===posName(slot.pos) || v==="")) delete slot.name; else slot.name=v;
    save(); const card=el.closest(".slot"); card.className="slot "+slotColor(slot); return;
  }
  if(el.dataset.f==="watk"){ const v=parseFloat(el.value); slot.watk=isNaN(v)?0:v; save(); renderSummary(); return; }
  if(el.dataset.f==="wac"){ const v=parseFloat(el.value); slot.wac=isNaN(v)?0:v; save(); renderSummary(); return; }
  const l=slot.lines[+el.dataset.l];
  if(el.dataset.f==="value"){ const v=parseFloat(el.value); l.value=isNaN(v)?0:v;
    const cap=el.closest(".line").querySelector(".cap");
    if(cap && l.type==="blue"){ const c=blueCapInfo(l,slot); cap.classList.toggle("over",c.over); cap.textContent=c.txt; }
    if(cap && l.type==="red"){ const m=RED[l.stat], over=l.value>m; cap.classList.toggle("over",over); cap.textContent=t("redCap",fmt(m)+unit(l.stat))+(over?t("overCap"):""); }
  }
  if(el.dataset.f==="stat") l.stat=el.value;
  save(); renderSummary();
});
$("#restoreSlots").onclick=()=>{

/* ---------- 總和 ---------- */
function renderSummary(){
  const b=B(), T={}, warns=[];
  const add=(stat,col,v)=>{ if(!stat||!v) return; (T[stat] ||= {c:0,w:0,s:0,b:0,r:0,l:0}); T[stat][col]+=v; };
  const j=JOB[b.crest]; if(j) for(const [k,v] of Object.entries(crestStats(j))) add(k,"c",v);
  const sj=JOB[b.setJob];
  if(sj&&b.setTier) sj.set.forEach((s,i)=>add(s,"s", b.setVals[i]==null?setAuto(s,b.setTier):b.setVals[i]));
  const act=b.slots.filter(slotOn);
  act.forEach(s=>{ add("AC","w",whiteAC(s)); add("物攻","w",whiteAtk(s)); add("HP","w",whiteHP(s)); });
  act.forEach(s=>s.lines.forEach(l=>{
    if(l.type==="blue"){
      add(E[l.id].stat,"b",l.value);
      const c=blueCapInfo(l,s); if(c.over) warns.push(t("warnBlue",slotName(s),S(E[l.id].stat),fmt(l.value)));
      return;
    }
    const col={red:"r",legend:"l",other:"l"}[l.type];
    add(l.type==="other"?(l.stat||"").trim():l.stat,col,l.value);
    if(l.type==="red"&&l.value>RED[l.stat]) warns.push(t("warnRed",slotName(s),S(l.stat),fmt(l.value),fmt(RED[l.stat])));
  }));
  $("#sumTitle").textContent = `${t("sumTitle")}　${b.name}`;
  const keys=Object.keys(T).sort((a,c)=>(ORDER[a]??999)-(ORDER[c]??999)||a.localeCompare(c));
  if(!keys.length){ $("#sumTable").innerHTML=`<p class="hint">${esc(t("sumEmpty"))}</p>`; }
  else {
    const cell=(v,cls)=>`<td class="num ${v?cls:"z"}">${v?fmt(v):"–"}</td>`;
    let nOver=0,nShort=0,nFull=0;
    const rows=keys.map(k=>{const r=T[k],tot=r.c+r.w+r.s+r.b+r.r+r.l, u=unit(k), e=BY_STAT[k];
      let totCell=`<td class="num total">${fmt(tot)}${u}</td>`, capCell=`<td class="num z">–</td>`, eqCell=`<td class="num z">–</td>`, stCell=`<td class="z">${esc(t("noCapData"))}</td>`;
      if(e && e.vals){
        const cap=e.max+r.c+r.w+r.r, a=Math.abs(tot-r.c-r.w-r.r), ac=Math.abs(e.max);
        let capG=e.maxG; for(let g=1;g<=e.maxG;g++){ if(Math.abs(eVal(e,g))>=ac-1e-9){ capG=g; break; } }
        let eq=0; for(let g=1;g<=e.maxG;g++){ if(Math.abs(eVal(e,g))<=a+1e-9) eq=g; else break; }
        const sub=(r.c||r.w||r.r)? t("capBlue",fmt(e.max)+u)+(r.c?t("capCrest",fmt(r.c)+u):"")+(r.w?t("capWhite",fmt(r.w)):"")+(r.r?t("capRed",fmt(r.r)+u):"") : "G"+capG;
        capCell=`<td class="num">${fmt(cap)}${u}<div class="sub">${esc(sub)}</div></td>`;
        eqCell=`<td class="num">${eq?"G"+eq:esc(t("belowG1"))}</td>`;
        if(a>ac+1e-9){ nOver++; totCell=`<td class="num total">${fmt(cap)}${u}</td>`; stCell=`<td class="st over">${esc(t("stOver",fmt(a-ac)+u))}<div class="sub">${esc(t("stOverSub"))}</div></td>`; }
        else if(Math.abs(a-ac)<1e-9){ nFull++; stCell=`<td class="st full">${esc(t("stFull"))}</td>`; }
        else { nShort++; stCell=`<td class="st short">${esc(t("stShort",fmt(ac-a)+u))}<div class="sub">${esc(t("stShortG",capG-eq))}</div></td>`; }
      }
      return `<tr><td>${esc(S(k))}</td>${totCell}${capCell}${eqCell}${stCell}${cell(r.c,"c")}${cell(r.w,"w")}${cell(r.s,"s")}${cell(r.b,"b")}${cell(r.r,"r")}${cell(r.l,"l")}</tr>`;}).join("");
    const th=["thStat","thTotal","thCap","thEq","thState","thCrest","thWhite","thSet","thBlue","thRed","thLegend"].map(k=>`<th>${esc(t(k))}</th>`).join("");
    $("#sumTable").innerHTML=`<div class="tally">${nOver?`<span class="over">${esc(t("nOver",nOver))}</span>`:""}${nShort?`<span class="short">${esc(t("nShort",nShort))}</span>`:""}${nFull?`<span class="full">${esc(t("nFull",nFull))}</span>`:""}</div><table><thead><tr>${th}</tr></thead><tbody>${rows}    </tbody></table>`;
  }
  $("#warns").innerHTML = warns.length? `<div class="warns">${esc(t("warnH"))}<ul>${warns.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>` : "";
}

const dlP = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null);
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#000"; }
function cellInfo(td){
  const sub=td.querySelector(".sub"); let main=td.textContent;
  if(sub) main=main.slice(0,main.length-sub.textContent.length);
  return {main:main.trim(), sub:sub?sub.textContent.trim():"", cls:td.className};
}
async function makeSummaryImage(){
  try{ await document.fonts.ready; }catch(e){}
  const b=B(), FONT='"Noto Sans TC","Noto Sans SC","Noto Sans KR","PingFang TC","Microsoft JhengHei",sans-serif';
  const C={bg:cssv("--panel"),ink:cssv("--ink"),muted:cssv("--muted"),line:cssv("--line"),gold:cssv("--gold"),
    c:cssv("--crest"),w:cssv("--white"),s:cssv("--set"),b:cssv("--blue"),r:cssv("--red"),l:cssv("--legend"),over:cssv("--red"),short:cssv("--legend"),full:cssv("--set")};
  const table=document.querySelector("#sumTable table");
  const head = table? [...table.tHead.rows[0].cells].map(c=>c.textContent) : [];
  const rows = table? [...table.tBodies[0].rows].map(tr=>[...tr.cells].map(cellInfo)) : [];
  const crest = JOB[b.crest]? `${jobName(b.crest)} G${CREST_G}` : t("none");
  const set = (JOB[b.setJob]&&b.setTier)? `${jobName(b.setJob)} ${t("t"+b.setTier)}` : t("none");
  const tally = document.querySelector("#sumTable .tally")? [...document.querySelectorAll("#sumTable .tally span")].map(s=>({t:s.textContent,col:C[s.className]||C.ink})) : [];
  const cv=document.createElement("canvas"), x=cv.getContext("2d"), S2=2, PAD=28;
  const f=(w,sz)=>`${w} ${sz}px ${FONT}`;
  x.font=f(700,15); const colW=head.map((h,i)=>{ let w=x.measureText(h).width;
    rows.forEach(r=>{ x.font=f(i===1?900:500,15); w=Math.max(w,x.measureText(r[i].main).width); x.font=f(400,12); w=Math.max(w,x.measureText(r[i].sub).width); }); return Math.ceil(w)+22; });
  const tableW=colW.reduce((a,c)=>a+c,0);
  const W=Math.max(tableW+PAD*2,560);
  const rowH=rows.map(r=>r.some(c=>c.sub)?46:32);
  const H=PAD+34+28+(tally.length?28:0)+10+32+rowH.reduce((a,c)=>a+c,0)+PAD+26;
  cv.width=W*S2; cv.height=H*S2; x.scale(S2,S2);
  x.fillStyle=C.bg; x.fillRect(0,0,W,H);
  x.fillStyle=C.gold; x.fillRect(0,0,W,5);
  let y=PAD+22; x.textBaseline="alphabetic";
  x.fillStyle=C.ink; x.font=f(900,22); x.fillText(`${t("sumTitle")}　${b.name}`,PAD,y);
  y+=28; x.font=f(500,14); x.fillStyle=C.c; const ct=t("imgCrest",crest); x.fillText(ct,PAD,y);
  const cw=x.measureText(ct).width; x.fillStyle=C.s; x.fillText(t("imgSet",set),PAD+cw+24,y);
  if(tally.length){ y+=26; let tx=PAD; x.font=f(700,14); tally.forEach(tt=>{ x.fillStyle=tt.col; x.fillText(tt.t,tx,y); tx+=x.measureText(tt.t).width+18; }); }
  y+=14;
  if(!rows.length){ x.fillStyle=C.muted; x.font=f(400,14); x.fillText(t("imgEmpty"),PAD,y+24); }
  else{
    let cx=PAD; x.font=f(500,12); x.fillStyle=C.muted;
    head.forEach((h,i)=>{ const w=colW[i]; if(i===0||i===4){x.textAlign="left";x.fillText(h,cx+6,y+20);} else {x.textAlign="right";x.fillText(h,cx+w-6,y+20);} cx+=w; });
    y+=32; x.strokeStyle=C.gold; x.lineWidth=1.5; x.beginPath(); x.moveTo(PAD,y-4); x.lineTo(PAD+tableW,y-4); x.stroke();
    rows.forEach((r,ri)=>{
      const h=rowH[ri]; cx=PAD;
      r.forEach((c,i)=>{
        const w=colW[i]; let col=C.ink, wt=500;
        if(i===1) wt=900;
        if(i===4){ col=/over/.test(c.cls)?C.over:/short/.test(c.cls)?C.short:/full/.test(c.cls)?C.full:C.muted; wt=700; }
        if(i>=5){ const k=(c.cls.match(/\b([cwsbrl])\b/)||[])[1]; col=c.main==="–"?C.line:(C[k]||C.ink); }
        if(i===2||i===3) col=c.main==="–"?C.line:C.ink;
        const left=(i===0||i===4); x.textAlign=left?"left":"right"; const tx=left?cx+6:cx+w-6;
        x.fillStyle=col; x.font=f(wt,15); x.fillText(c.main,tx,y+20);
        if(c.sub){ x.fillStyle=C.muted; x.font=f(400,12); x.fillText(c.sub,tx,y+37); }
        cx+=w;
      });
      y+=h; x.strokeStyle=C.line; x.lineWidth=1; x.beginPath(); x.moveTo(PAD,y-4); x.lineTo(PAD+tableW,y-4); x.stroke();
    });
  }
  x.textAlign="left"; x.fillStyle=C.muted; x.font=f(400,11);
  x.fillText(`${t("title")}　${new Date().toLocaleString(LOCALE[LANG])}`,PAD,H-PAD+10);
  return await new Promise(res=>cv.toBlob(res,"image/png"));
}
const imgDlg=document.getElementById("imgDlg");
let lastImgUrl=null;
const safeName = s2 => String(s2).replace(/[\\/:*?"<>|\s]+/g,"_");
async function offerImage(blob,name,title){
  const dl=await dlP;
  if(dl){
    try{ await dl.save({filename:name,data:blob}); return; }
    catch(e){ if(e&&(e.code==="declined"||e.code==="rate_limited")) return; }
  }
  if(lastImgUrl) URL.revokeObjectURL(lastImgUrl);
  lastImgUrl=URL.createObjectURL(blob);
  $("#imgH").textContent=title;
  document.getElementById("imgPrev").src=lastImgUrl;
  const a=document.getElementById("imgDl"); a.href=lastImgUrl; a.download=name;
  imgDlg.showModal();
}

/* ---------- 匯出裝備（套裝名稱 + 各部位類型） ---------- */
function gearRows(){
  const b=B(), rows=[];
  const sj=JOB[b.setJob];
  rows.push([t("gearSet"), (sj&&b.setTier)? `${jobName(b.setJob)} ${t("t"+b.setTier)}` : t("none"), true]);
  b.slots.forEach(s=>{
    let v;
    if(isShield(s) && !slotOn(s)) v=t("gearOff");
    else { v=kindName(slotKind(s)); if(isCloak(s)&&CLOAK[s.cloak]) v+=LANG==="en"||LANG==="ko"? ` (${cloakName(s.cloak)})` : `（${cloakName(s.cloak)}）`; }
    rows.push([slotName(s), v, false]);
  });
  return rows;
}
function gearText(){
  const sep = (LANG==="en"||LANG==="ko") ? ": " : "：";
  return `${t("title")}　${B().name}\n`+gearRows().map(([k,v])=>`${k}${sep}${v}`).join("\n");
}
async function makeGearImage(){
  try{ await document.fonts.ready; }catch(e){}
  const b=B(), FONT='"Noto Sans TC","Noto Sans SC","Noto Sans KR","PingFang TC","Microsoft JhengHei",sans-serif';
  const C={bg:cssv("--panel"),ink:cssv("--ink"),muted:cssv("--muted"),line:cssv("--line"),gold:cssv("--gold"),s:cssv("--set")};
  const rows=gearRows(), cv=document.createElement("canvas"), x=cv.getContext("2d"), S2=2, PAD=28, RH=34;
  const f=(w,sz)=>`${w} ${sz}px ${FONT}`;
  x.font=f(500,15); let lw=0; rows.forEach(r=>{ lw=Math.max(lw,x.measureText(r[0]).width); });
  x.font=f(700,16); let vw=0; rows.forEach(r=>{ vw=Math.max(vw,x.measureText(r[1]).width); });
  x.font=f(900,21); const tw=x.measureText(`${t("gearH")}　${b.name}`).width;
  lw=Math.ceil(lw); vw=Math.ceil(vw);
  const GAP=30, W=Math.max(PAD*2+lw+GAP+vw, PAD*2+tw, 400), H=PAD+36+rows.length*RH+PAD+16;
  cv.width=W*S2; cv.height=H*S2; x.scale(S2,S2);
  x.fillStyle=C.bg; x.fillRect(0,0,W,H);
  x.fillStyle=C.gold; x.fillRect(0,0,W,5);
  x.textBaseline="alphabetic"; x.textAlign="left";
  let y=PAD+24;
  x.fillStyle=C.ink; x.font=f(900,21); x.fillText(`${t("gearH")}　${b.name}`,PAD,y);
  y+=18;
  rows.forEach((r,i)=>{
    const ry=y+RH*i;
    x.fillStyle=C.muted; x.font=f(500,15); x.fillText(r[0],PAD,ry+22);
    x.fillStyle=r[2]?C.s:C.ink; x.font=f(700,16); x.fillText(r[1],PAD+lw+GAP,ry+22);
    x.strokeStyle=r[2]?C.gold:C.line; x.lineWidth=r[2]?1.5:1;
    x.beginPath(); x.moveTo(PAD,ry+RH-3); x.lineTo(W-PAD,ry+RH-3); x.stroke();
  });
  x.fillStyle=C.muted; x.font=f(400,11);
  x.fillText(`${t("title")}　${new Date().toLocaleString(LOCALE[LANG])}`,PAD,H-PAD+12);
  return await new Promise(res=>cv.toBlob(res,"image/png"));
}
